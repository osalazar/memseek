collections:
- name: friendship_suggestions
  version: 1
  active: true
  mode: keyed
  schema:
    type: object
    required:
    - text
    - kind
    - activation
    - visibility
    - valid_until
    - name
    - confidence
    - evidence
    - limitations
    properties:
      text:
        type: string
        minLength: 1
        maxLength: 4000
      kind:
        type: string
        enum:
        - relationship
        - situation
        - commitment
        - procedure
        - fact
      activation:
        type: string
        enum:
        - candidate
        - confirmed
        - rejected
      visibility:
        type: string
        enum:
        - private
        - shareable
      valid_until:
        type: integer
        minimum: 0
      tombstone:
        type: boolean
      review_id:
        type: string
      source_line:
        type: integer
      source_sha256:
        type: string
      biography_source_claim:
        type: string
      name:
        type: string
      confidence:
        type: string
        enum:
        - low
        - moderate
      evidence:
        type: array
        items:
          type: string
      limitations:
        type: array
        items:
          type: string
    additionalProperties: false
  fields:
    kind:
      path: content.kind
      type: string
      filter: true
      project: true
    activation:
      path: content.activation
      type: string
      filter: true
      project: true
    visibility:
      path: content.visibility
      type: string
      filter: true
      project: true
    valid_until:
      path: content.valid_until
      type: integer
      filter: true
      project: true
    source_line:
      path: content.source_line
      type: integer
      filter: true
      project: true
      sort: true
  required_processors: []
  search_profile: pg_default
- name: relationship_sources
  version: 1
  active: true
  mode: keyed
  schema:
    type: object
    required:
    - text
    - authority
    - source
    properties:
      text:
        type: string
      authority:
        type: string
        enum:
        - external
        - owner
      source:
        type: string
    additionalProperties: false
  fields: {}
  required_processors: []
  search_profile: pg_default
